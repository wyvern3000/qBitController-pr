name: Debug Signing Final Verify (temp)

# Verifies the SIGNING_* secrets now that they've been moved to Repository-level Actions secrets.
# Delete once confirmed working.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Report secret length (sanity check only, no content)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "SIGNING_KEYSTORE_BASE64 length: ${#KS}"

      - name: Build signed release APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleFreeRelease 2>&1 | tee build-output.log
        env:
          QBITCONTROLLER_SIGN_RELEASE: true
          QBITCONTROLLER_STORE_FILE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          QBITCONTROLLER_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          QBITCONTROLLER_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          QBITCONTROLLER_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        continue-on-error: true

      - name: Verify APK signature
        if: steps.build.outcome == 'success'
        run: |
          apk_path=composeApp/build/outputs/apk/free/release/composeApp-free-release.apk
          echo "APK size: $(stat -c%s "$apk_path")"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$apk_path"

      - name: Save build log to repo on failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 60000 build-output.log > build-error-signfinal.log
          CONTENT=$(base64 -w0 build-error-signfinal.log)
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-error-signfinal.log" \
            -d "{\"message\":\"Debug: final signing verify error log for ${{ github.sha }}\",\"content\":\"$CONTENT\",\"branch\":\"${{ github.ref_name }}\"}"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
