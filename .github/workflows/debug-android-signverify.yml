name: Debug Android Signing Verify (temp)

# Verifies the SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS /
# SIGNING_KEY_PASSWORD secrets actually produce a valid signed build, using the CORRECT
# secret names this time (earlier debug-android-signed.yml wrongly referenced
# secrets.store-file-base64 etc., which only resolves inside build.yml's own reusable-workflow
# secret context - not in a standalone workflow_dispatch job - so it silently read empty values).
# Delete once resolved / no longer needed.

on:
  workflow_dispatch:

jobs:
  build-android-signed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleFreeRelease 2>&1 | tee build-output.log
        env:
          QBITCONTROLLER_SIGN_RELEASE: true
          QBITCONTROLLER_STORE_FILE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          QBITCONTROLLER_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          QBITCONTROLLER_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          QBITCONTROLLER_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        continue-on-error: true

      - name: Save build log to repo on failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 60000 build-output.log > build-error-signverify.log
          CONTENT=$(base64 -w0 build-error-signverify.log)
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-error-signverify.log" \
            -d "{\"message\":\"Debug: signing verify error log for ${{ github.sha }}\",\"content\":\"$CONTENT\",\"branch\":\"${{ github.ref_name }}\"}"

      - name: Check APK was actually produced and signed
        if: steps.build.outcome == 'success'
        run: |
          ls -la composeApp/build/outputs/apk/free/release/
          apk_path=composeApp/build/outputs/apk/free/release/composeApp-free-release.apk
          echo "APK size: $(stat -c%s "$apk_path")"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$apk_path" || echo "APKSIGNER_CHECK_FAILED"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
