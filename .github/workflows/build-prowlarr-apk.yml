name: Build Prowlarr Feature APK (dev)

# Temporary, dev-only workflow for testing the Prowlarr feature branch - not part of upstream's
# release process (see build.yml / build-snapshot.yml / build-release.yml for those). Builds only
# the free-flavor debug APK, which Android Gradle Plugin signs automatically with a debug keystore,
# so no signing secrets are needed here. Safe to delete once this branch is merged or abandoned.
#
# Manual-dispatch only (round 8+): this used to also trigger on every push to the branch, but the
# push-after-every-commit habit from the collaboration convention (see repo-level 代码协作与推送策略)
# meant a ~6min CI build fired on every small, individually-verified commit, not just at meaningful
# checkpoints. Push-to-save-progress and build-to-verify are different concerns and shouldn't be
# coupled - commits/pushes stay frequent, but a build only runs when explicitly dispatched (gh CLI:
# `gh workflow run build-prowlarr-apk.yml --ref feature/prowlarr-connection`, or the Actions tab).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Needs bash (Git Bash), python3, and the `gh` CLI on this runner's PATH, in addition to
  # the JDK/Gradle setup below.
  build-android-debug:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        shell: bash
        # `set -o pipefail` is required here: without it, `cmd | tee file` reports tee's exit code
        # (always 0) as the step's result, not gradlew's - so a real compile failure was silently
        # recorded as steps.build.outcome == 'success', the log-capture step below never ran, and
        # the job "passed" with 0 artifacts produced. Confirmed this actually happened on run
        # 31287174798 (commit 30d72335): "Build debug APK" showed success and ran the full ~5m52s
        # a failing build takes, but produced zero APK artifacts, and Upload artifact only warned
        # instead of failing because actions/upload-artifact defaults to if-no-files-found: warn.
        run: |
          set -o pipefail
          ./gradlew assembleFreeDebug 2>&1 | tee build-output.log
        continue-on-error: true

      # This sandbox's build feedback loop can't reach GitHub's log storage (Azure Blob Storage,
      # not on the network allowlist), so on failure the tail of the build output is written
      # straight back into the repo via the Contents API instead, which is reachable. Temporary,
      # delete this step (and any build-error.log it leaves behind) once the branch builds clean.
      - name: Save build log to repo on failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          tail -c 60000 build-output.log > build-error-tail.log
          CONTENT=$(base64 -w0 build-error-tail.log)
          EXISTING_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-error.log?ref=${{ github.ref_name }}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))")
          if [ -n "$EXISTING_SHA" ]; then
            SHA_JSON=",\"sha\":\"$EXISTING_SHA\""
          else
            SHA_JSON=""
          fi
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-error.log" \
            -d "{\"message\":\"Build error log for ${{ github.sha }}\",\"content\":\"$CONTENT\",\"branch\":\"${{ github.ref_name }}\"$SHA_JSON}"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Publish beta release
        id: publish
        shell: bash
        # actions/upload-artifact was reporting 0 files with if-no-files-found: error even though
        # the APK was confirmed present on disk (Round 17/18) - user confirmed 2026-08-16 the real
        # cause is this private repo's Actions/Packages storage quota being full, not a glob or
        # path bug. Release assets are billed separately from that quota, so publishing a beta
        # release here sidesteps the problem entirely instead of requiring a quota cleanup first.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="beta-${{ github.run_number }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          gh release create "$TAG" \
            composeApp/build/outputs/apk/free/debug/*.apk \
            --repo "${{ github.repository }}" \
            --title "Prowlarr dev beta #${{ github.run_number }} ($SHORT_SHA)" \
            --notes "Dev/test build from \`${{ github.ref_name }}\` @ $SHORT_SHA. Free-flavor debug APK, auto-signed with the debug keystore. Internal testing only, not for general distribution." \
            --prerelease
