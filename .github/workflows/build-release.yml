name: Build Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Extract version
        id: set-version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build:
    needs: extract-version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.extract-version.outputs.version }}
      sign-android: true
      disable-cache: true
      release-tag: ${{ github.ref_name }}
    secrets:
      store-file-base64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      store-password: ${{ secrets.SIGNING_STORE_PASSWORD }}
      key-alias: ${{ secrets.SIGNING_KEY_ALIAS }}
      key-password: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # Finalizes the release's title/body and takes it out of prerelease status. Runs whenever
  # extract-version succeeded, regardless of whether every platform in `build` succeeded -
  # a single flaky leg (e.g. windows-arm64, see build.yml) shouldn't leave the release stuck
  # with the generic "Automated multi-platform build" placeholder text from build.yml's
  # create-release step. Each platform job already attaches its own asset directly to the
  # release via the GitHub REST API (see build.yml's "Attach to release" steps), so this job
  # no longer downloads/re-uploads artifacts itself - that used to be the only way to get
  # files onto the release, but is now redundant and, worse, would error out if any platform's
  # actions/upload-artifact step never ran (it's continue-on-error and skipped entirely when
  # an earlier step in that job fails).
  upload-release:
    needs:
      - extract-version
      - build
    if: always() && needs.extract-version.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Extract release body from tag message
        id: changelog
        shell: bash
        run: |
          TAG_NAME=${{ github.ref_name }}
          TAG_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG_NAME" | \
            jq -r '.object.sha')
          
          BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/tags/$TAG_SHA" | \
            jq -r '.message' | tail -n +2)
          
          BODY_CLEAN=$(echo "$BODY" | sed '/^-----BEGIN PGP SIGNATURE-----$/,/^-----END PGP SIGNATURE-----$/d')
          
          {
            echo "body<<EOF"
            echo "$BODY_CLEAN"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Finalize GitHub release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          name: qBitController ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: false
