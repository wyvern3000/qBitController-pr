name: Build Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  extract-version:
    runs-on: [self-hosted, Windows, X64]
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Extract version
        id: set-version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  build:
    needs: extract-version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.extract-version.outputs.version }}
      sign-android: true
      disable-cache: true
      release-tag: ${{ github.ref_name }}
    secrets:
      store-file-base64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      store-password: ${{ secrets.SIGNING_STORE_PASSWORD }}
      key-alias: ${{ secrets.SIGNING_KEY_ALIAS }}
      key-password: ${{ secrets.SIGNING_KEY_PASSWORD }}

  upload-release:
    needs:
      - extract-version
      - build
    # Needs `jq` on PATH in addition to bash/git/gh, for the changelog-extraction step below.
    runs-on: [self-hosted, Windows, X64]
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Extract release body from tag message
        id: changelog
        shell: bash
        run: |
          TAG_NAME=${{ github.ref_name }}
          TAG_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG_NAME" | \
            jq -r '.object.sha')
          
          BODY=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/tags/$TAG_SHA" | \
            jq -r '.message' | tail -n +2)
          
          BODY_CLEAN=$(echo "$BODY" | sed '/^-----BEGIN PGP SIGNATURE-----$/,/^-----END PGP SIGNATURE-----$/d')
          
          {
            echo "body<<EOF"
            echo "$BODY_CLEAN"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          name: qBitController ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: qbitcontroller-${{ needs.extract-version.outputs.version }}-*.*
