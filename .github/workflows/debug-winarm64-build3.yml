name: Debug Windows ARM64 Build 3 (temp)

on:
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build project
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew packageReleaseMsi 2>&1 | tee build-output.log
        continue-on-error: true

      - name: Save build log to repo on failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          tail -c 60000 build-output.log > build-error-winarm64-3.log
          CONTENT=$(base64 -w0 build-error-winarm64-3.log)
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-error-winarm64-3.log" \
            -d "{\"message\":\"Debug: windows-arm64 build error log 3 for ${{ github.sha }}\",\"content\":\"$CONTENT\",\"branch\":\"${{ github.ref_name }}\"}"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        shell: bash
        run: exit 1
