name: Diagnose Runner (temp)

# One-off: check what's actually on the self-hosted Windows runner's PATH, since job logs
# redirect to Azure Blob Storage which isn't reachable from the debugging sandbox. Writes
# findings to runner-diag.log in the repo via the Contents API instead. Delete once used.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Gather diagnostics and write to repo
        shell: pwsh
        run: |
          $out = @()
          $out += "=== whoami / shell ==="
          $out += (whoami)
          $out += "PSVersion: $($PSVersionTable.PSVersion)"
          $out += ""
          $out += "=== bash ==="
          $bash = Get-Command bash -ErrorAction SilentlyContinue
          if ($bash) {
            $out += "bash found at: $($bash.Source)"
            $out += (& bash --version | Select-Object -First 1)
          } else {
            $out += "bash: NOT FOUND on PATH"
          }
          $out += ""
          $out += "=== gh ==="
          $gh = Get-Command gh -ErrorAction SilentlyContinue
          if ($gh) { $out += "gh found at: $($gh.Source)"; $out += (& gh --version | Select-Object -First 1) } else { $out += "gh: NOT FOUND on PATH" }
          $out += ""
          $out += "=== python3 ==="
          $py3 = Get-Command python3 -ErrorAction SilentlyContinue
          $py = Get-Command python -ErrorAction SilentlyContinue
          if ($py3) { $out += "python3 found at: $($py3.Source)" } elseif ($py) { $out += "python3 NOT found but python found at: $($py.Source)" } else { $out += "python3/python: NOT FOUND on PATH" }
          $out += ""
          $out += "=== jq ==="
          $jq = Get-Command jq -ErrorAction SilentlyContinue
          if ($jq) { $out += "jq found at: $($jq.Source)" } else { $out += "jq: NOT FOUND on PATH" }
          $out += ""
          $out += "=== git ==="
          $out += (git --version)
          $out += ""
          $out += "=== PATH ==="
          $out += ($env:PATH -split ';')

          $content = ($out -join "`n")
          Set-Content -Path runner-diag.log -Value $content -Encoding utf8

          $bytes = [System.IO.File]::ReadAllBytes("runner-diag.log")
          $b64 = [Convert]::ToBase64String($bytes)

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/runner-diag.log?ref=$env:GITHUB_REF_NAME" -Headers $headers -Method Get
          } catch {}

          $body = @{ message = "Runner diagnostics"; content = $b64; branch = $env:GITHUB_REF_NAME }
          if ($existing) { $body.sha = $existing.sha }
          $bodyJson = $body | ConvertTo-Json

          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/runner-diag.log" -Headers $headers -Method Put -Body $bodyJson -ContentType "application/json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
