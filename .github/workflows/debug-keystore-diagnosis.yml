name: Debug Keystore Base64 Diagnosis (temp)

# Diagnoses whether SIGNING_KEYSTORE_BASE64 fails inside Gradle's Kotlin Base64.decode() because
# it contains embedded line-wrap newlines (bash's `base64 -d` tolerates these; Kotlin's strict
# decoder may not) rather than the underlying keystore data being wrong. Delete once resolved.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Report raw secret shape (lengths/newlines only, never the content)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" > /tmp/raw_secret.txt
          echo "Total length (bytes, via wc -c): $(wc -c < /tmp/raw_secret.txt)"
          echo "Number of newline chars: $(tr -cd '\n' < /tmp/raw_secret.txt | wc -c)"
          echo "Number of CR chars: $(tr -cd '\r' < /tmp/raw_secret.txt | wc -c)"
          echo "Contains '+' : $(grep -c '+' /tmp/raw_secret.txt || true)"
          echo "Contains '/' : $(grep -c '/' /tmp/raw_secret.txt || true)"
          echo "Contains '-' (url-safe alphabet marker): $(grep -c -- '-' /tmp/raw_secret.txt || true)"
          echo "Contains '_' (url-safe alphabet marker): $(grep -c '_' /tmp/raw_secret.txt || true)"

      - name: Decode via bash base64 (tolerant of line wraps) and try keytool
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          printf '%s' "$KS" | base64 -d > /tmp/bash-decoded.jks 2>/tmp/bash-decode-stderr.txt || echo "BASH_DECODE_EXIT_NONZERO"
          echo "Decoded file size: $(stat -c%s /tmp/bash-decoded.jks 2>/dev/null || echo MISSING)"
          echo "--- bash base64 -d stderr ---"
          cat /tmp/bash-decode-stderr.txt
          echo "--- keytool -list result on bash-decoded file ---"
          keytool -list -keystore /tmp/bash-decoded.jks -storepass "$PW" 2>&1 || echo "KEYTOOL_FAILED_ON_BASH_DECODED"

      - name: Add temp Gradle task that runs the exact same Kotlin Base64.decode() path
        run: |
          cat >> composeApp/build.gradle.kts << 'GRADLE_EOF'

          tasks.register("debugDecodeKeystore") {
              doLast {
                  val ks = System.getenv("KS")!!
                  val decoded = try {
                      kotlin.io.encoding.Base64.decode(ks)
                  } catch (e: Exception) {
                      println("KOTLIN_DECODE_THREW: ${e::class.simpleName}: ${e.message}")
                      null
                  }
                  if (decoded != null) {
                      println("KOTLIN_DECODE_SUCCEEDED bytes=${decoded.size}")
                      File("/tmp/kotlin-decoded.jks").writeBytes(decoded)
                  }
              }
          }
          GRADLE_EOF

      - name: Run diagnostic Gradle task
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew :composeApp:debugDecodeKeystore --console=plain
          if [ -f /tmp/kotlin-decoded.jks ]; then
            echo "Kotlin-decoded file size: $(stat -c%s /tmp/kotlin-decoded.jks)"
            echo "--- keytool -list result on kotlin-decoded file ---"
            keytool -list -keystore /tmp/kotlin-decoded.jks -storepass "$PW" 2>&1 || echo "KEYTOOL_FAILED_ON_KOTLIN_DECODED"
            echo "--- diff bash vs kotlin decoded files ---"
            cmp /tmp/bash-decoded.jks /tmp/kotlin-decoded.jks && echo "IDENTICAL" || echo "DIFFERENT (see sizes above)"
          fi
