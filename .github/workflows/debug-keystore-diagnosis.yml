name: Debug Keystore Base64 Diagnosis (temp)

# Diagnoses whether SIGNING_KEYSTORE_BASE64 fails inside Gradle's Kotlin Base64.decode() because
# it contains embedded line-wrap newlines (bash's `base64 -d` tolerates these; Kotlin's strict
# decoder may not) rather than the underlying keystore data being wrong. All output is collected
# into one log and written back to the repo (sandbox can't reach Actions' log blob storage
# directly). Delete once resolved.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Add temp Gradle task that runs the exact same Kotlin Base64.decode() path
        run: |
          cat >> composeApp/build.gradle.kts << 'GRADLE_EOF'

          tasks.register("debugDecodeKeystore") {
              doLast {
                  val ks = System.getenv("KS")!!
                  val decoded = try {
                      kotlin.io.encoding.Base64.decode(ks)
                  } catch (e: Exception) {
                      println("KOTLIN_DECODE_THREW: ${e::class.simpleName}: ${e.message}")
                      null
                  }
                  if (decoded != null) {
                      println("KOTLIN_DECODE_SUCCEEDED bytes=${decoded.size}")
                      File("/tmp/kotlin-decoded.jks").writeBytes(decoded)
                  }
              }
          }
          GRADLE_EOF

      - name: Run full diagnosis
        id: diag
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set +e
          {
            echo "=== Secret shape ==="
            printf '%s' "$KS" > /tmp/raw_secret.txt
            echo "Total length (wc -c): $(wc -c < /tmp/raw_secret.txt)"
            echo "Newline count: $(tr -cd '\n' < /tmp/raw_secret.txt | wc -c)"
            echo "CR count: $(tr -cd '\r' < /tmp/raw_secret.txt | wc -c)"
            echo "Contains '-': $(grep -c -- '-' /tmp/raw_secret.txt)"
            echo "Contains '_': $(grep -c '_' /tmp/raw_secret.txt)"

            echo ""
            echo "=== bash base64 -d + keytool ==="
            printf '%s' "$KS" | base64 -d > /tmp/bash-decoded.jks 2>/tmp/bash-decode-stderr.txt
            echo "bash decode exit: $?"
            echo "Decoded file size: $(stat -c%s /tmp/bash-decoded.jks 2>/dev/null || echo MISSING)"
            echo "stderr: $(cat /tmp/bash-decode-stderr.txt)"
            keytool -list -keystore /tmp/bash-decoded.jks -storepass "$PW" 2>&1

            echo ""
            echo "=== Kotlin Base64.decode via Gradle task ==="
            ./gradlew :composeApp:debugDecodeKeystore --console=plain 2>&1

            if [ -f /tmp/kotlin-decoded.jks ]; then
              echo "Kotlin-decoded file size: $(stat -c%s /tmp/kotlin-decoded.jks)"
              keytool -list -keystore /tmp/kotlin-decoded.jks -storepass "$PW" 2>&1
              cmp /tmp/bash-decoded.jks /tmp/kotlin-decoded.jks && echo "FILES IDENTICAL" || echo "FILES DIFFERENT"
            else
              echo "No kotlin-decoded.jks produced"
            fi
          } > /tmp/diag-output.log 2>&1
          cat /tmp/diag-output.log

      - name: Save diagnostic output to repo
        if: always()
        run: |
          CONTENT=$(base64 -w0 /tmp/diag-output.log)
          curl -s -o /tmp/put-response.json -w "HTTP_STATUS:%{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-error-keystore-diag.log" \
            -d "{\"message\":\"Debug: keystore base64 diagnosis for ${{ github.sha }}\",\"content\":\"$CONTENT\",\"branch\":\"${{ github.ref_name }}\"}"
          cat /tmp/put-response.json
